<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单词保卫战 · 闽教版小学英语</title>
  <link rel="stylesheet" href="desk.css?v=book-stacks">
  <script src="words.js"></script>
  <script src="desk.js?v=book-stacks" defer></script>
<link rel="stylesheet" href="phone-orientation.css">
<link rel="stylesheet" href="https://niannianweike.top/media/project-qr.css">
<script defer src="https://niannianweike.top/media/project-qr.js"></script>
<script defer src="phone-orientation.js"></script>
</head>
<body>
  <main class="desk">
    <header class="masthead">
      <a href="/tools/html/">← 教具库</a>
      <button type="button" class="project-qr-trigger" data-project-qr data-project-qr-rotation aria-controls="project-qr-panel" aria-expanded="false">联系我</button>
    </header>
    <div class="headline">
      <p class="edition">闽教版 · 小学英语</p>
      <h1>单词保卫战</h1>
      <p class="instruction">选一本课本翻开，再挑一个单元</p>
    </div>
    <div class="stage">
      <div class="table" aria-hidden="true"></div>
      <div class="zombie zombie-left" aria-hidden="true"><img src="desk-zombie.svg" alt=""><span class="word-tag">apple</span></div>
      <div class="zombie zombie-right" aria-hidden="true"><img src="desk-zombie.svg" alt=""><span class="word-tag">hello</span></div>
      <div class="books" aria-label="按年级选课本">
        <div class="stack" role="group" aria-label="三年级">
          <div class="book-pile">
            <button class="volume-book upper" type="button" data-volume="volume-0-0"
                    style="--book:#327160" aria-label="三年级上册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">3</span>
              </span>
              <span class="book-term">上册</span>
            </button>
            <button class="volume-book lower" type="button" data-volume="volume-0-1"
                    style="--book:#386153" aria-label="三年级下册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">3</span>
              </span>
              <span class="book-term">下册</span>
            </button>
          </div>
          <strong class="book-label" aria-hidden="true">三年级</strong>
        </div>
        <div class="stack" role="group" aria-label="四年级">
          <div class="book-pile">
            <button class="volume-book upper" type="button" data-volume="volume-1-0"
                    style="--book:#416883" aria-label="四年级上册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">4</span>
              </span>
              <span class="book-term">上册</span>
            </button>
            <button class="volume-book lower" type="button" data-volume="volume-1-1"
                    style="--book:#36546e" aria-label="四年级下册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">4</span>
              </span>
              <span class="book-term">下册</span>
            </button>
          </div>
          <strong class="book-label" aria-hidden="true">四年级</strong>
        </div>
        <div class="stack" role="group" aria-label="五年级">
          <div class="book-pile">
            <button class="volume-book upper" type="button" data-volume="volume-2-0"
                    style="--book:#a9603f" aria-label="五年级上册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">5</span>
              </span>
              <span class="book-term">上册</span>
            </button>
            <button class="volume-book lower" type="button" data-volume="volume-2-1"
                    style="--book:#854b36" aria-label="五年级下册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">5</span>
              </span>
              <span class="book-term">下册</span>
            </button>
          </div>
          <strong class="book-label" aria-hidden="true">五年级</strong>
        </div>
        <div class="stack" role="group" aria-label="六年级">
          <div class="book-pile">
            <button class="volume-book upper" type="button" data-volume="volume-3-0"
                    style="--book:#745780" aria-label="六年级上册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">6</span>
              </span>
              <span class="book-term">上册</span>
            </button>
            <button class="volume-book lower" type="button" data-volume="volume-3-1"
                    style="--book:#544363" aria-label="六年级下册" aria-haspopup="dialog">
              <span class="textbook" aria-hidden="true">
                <span class="book-series">小学英语 · 闽教版</span><span class="book-english">English</span>
                <span class="book-letter">6</span>
              </span>
              <span class="book-term">下册</span>
            </button>
          </div>
          <strong class="book-label" aria-hidden="true">六年级</strong>
        </div>
      </div>
      <div class="pea-corner">
        <section class="pea-bubble" id="pea-guide" aria-label="小豌豆讲玩法" hidden>
          <div class="pea-bubble-head">
            <strong>小豌豆</strong>
            <button type="button" id="pea-close" aria-label="收起讲解">×</button>
          </div>
          <div class="pea-letters" id="pea-letters" lang="en"></div>
          <p class="pea-line" id="pea-line" aria-live="polite"></p>
          <button class="pea-action" type="button" id="pea-play">暂停</button>
        </section>
        <button class="pea" id="pea" type="button" aria-expanded="false" aria-controls="pea-guide">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 140 112">
  <defs><linearGradient id="pod" x2=".25" y2="1"><stop stop-color="#a6cc59"/><stop offset="1" stop-color="#3e773d"/></linearGradient>
    <radialGradient id="pea-face-fill" cx=".3" cy=".24" r=".9"><stop stop-color="#e1ef96"/><stop offset="1" stop-color="#97bb48"/></radialGradient></defs>
  <g stroke="#294934" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M43 88l-8 13-10 1m58-13 9 10 11-1" fill="none"/>
    <path d="M21 66C9 64 9 48 3 49m110 24q13-4 19-20m-1 6 6-5m-7 5-2-6" fill="none"/>
    <path d="M13 49C24 19 51 18 73 29c22-7 38 7 51 15-3 25-18 47-47 51C46 99 19 82 13 49z" fill="#4d7a36"/>
    <circle cx="51" cy="56" r="23" fill="url(#pea-face-fill)"/><circle cx="89" cy="52" r="24" fill="url(#pea-face-fill)"/>
    <path d="M13 49c17 20 34 27 57 27 24 0 44-12 54-32-2 35-24 51-49 53-34 3-54-19-62-48z" fill="url(#pod)"/>
    <path d="M22 54c6-16-10-26-15-37 19-1 32 8 36 22-1-13 8-25 26-30-2 17-14 31-27 35" fill="#78aa4d"/>
    <path d="M20 38Q6 35 8 24m29 51q17 17 39 14" fill="none" stroke="#d4e67c" stroke-width="2"/>
    <g fill="#21392a" stroke="none"><ellipse cx="46" cy="55" rx="2.7" ry="4"/><ellipse cx="60" cy="56" rx="2.7" ry="4"/><ellipse cx="84" cy="51" rx="2.7" ry="4"/><ellipse cx="99" cy="48" rx="2.7" ry="4"/></g>
    <path class="pea-smile" d="M50 62q4 6 8 0" fill="none" stroke-width="2"/>
    <g class="pea-mouth">
      <ellipse cx="54" cy="64" rx="5.4" ry="4.7" fill="#432c31" stroke-width="1.2"/>
      <path d="M51 66q3-3 6 0" fill="none" stroke="#ed9a8e" stroke-width="1.6"/>
    </g>
    <path d="M86 58q6 5 10-1" fill="none" stroke-width="2"/>
  </g>
</svg>
          <span>听豌豆讲玩法</span>
        </button>
        <audio id="pea-audio" src="pea-guide-doubao.mp3" preload="none" hidden></audio>
      </div>
    </div>
    <footer class="desk-footer" id="desk-footer">三至六年级 · 8 册 52 个单元</footer>
  </main>
  <dialog id="book-dialog" class="book-dialog" aria-labelledby="current-volume">
    <div class="open-book">
      <div class="book-left" aria-hidden="true"><span>English</span><strong>单词保卫战</strong></div>
      <div class="book-right">
        <header>
          <h2 id="current-volume">选择单元</h2>
          <form method="dialog"><button class="book-close">合上课本</button></form>
        </header>
        <div class="volumes"></div>
      </div>
    </div>
  </dialog>
  <div class="fallback" id="volume-list">
    <h1>单词保卫战</h1>
  </div>
  <script src="index-books.js"></script>
</body>
</html>
