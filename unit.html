<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>单词保卫战 · 闽教版小学英语</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="phone-orientation.css">
<script defer src="phone-orientation.js"></script>
</head>
<body>

<div id="home">
  <div class="speed" id="speed"></div>
  <div class="levels" id="levels"></div>
  <div id="switch" style="display:none"><a class="b-sub" href="index.html">← 换一个单元</a></div>
</div>

<div id="game" class="hide">
  <div id="bar">
    <button class="bbtn" id="quit" title="返回">✕</button>
    <button class="bbtn" id="pause" title="暂停">⏸</button>
    <div id="wave"></div>
    <button class="bbtn" id="shovel" title="铲除：拔掉射手" aria-label="铲除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 6-2 2-6-6z" fill="#8d6e63" stroke="#4e342e" stroke-width="1.4" stroke-linejoin="round"/><path d="M13 8l3 3-6.5 6.5-3-3z" fill="#a1887f" stroke="#4e342e" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 13.5l3 3-3.2 3.7c-1 1.1-2.9 1.2-4 .1s-1-3 .1-4z" fill="#90a4ae" stroke="#37474f" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="t">铲除</span></button>
  </div>
  <div id="belt"></div>
  <div id="field"><div id="banner"></div></div>
</div>
<div id="ghost" class="hide"></div>

<div id="modal" class="mask hide"><div class="box" id="mbox"></div></div>

<script src="words.js"></script>
<script src="word-icons.js"></script>
<script src="audio/manifest.js"></script>
<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const books = window.BOOKS || [];
  const bookIndex = Math.max(0, books.findIndex(b => b.id === params.get('book')));
  const book = books[bookIndex] || { id: 'g3a', units: [] };
  const homeHash = `volume-${Math.floor(bookIndex / 2)}-${bookIndex % 2}`;
  const unitNo = Number(params.get('unit'));
  const unitIndex = book.units.findIndex(u => u.no === unitNo);

  if (params.has('unit') && unitIndex >= 0) {
    let nextBookIndex = bookIndex;
    let nextUnitIndex = unitIndex + 1;
    if (nextUnitIndex >= book.units.length) {
      nextBookIndex += 1;
      nextUnitIndex = 0;
    }
    const nextBook = books[nextBookIndex];
    const nextUnit = nextBook && nextBook.units[nextUnitIndex];
    window.GAME_CONFIG = {
      bookId: book.id,
      unitId: 'u' + book.units[unitIndex].no,
      nextUrl: nextBook && nextUnit
        ? `unit.html?book=${encodeURIComponent(nextBook.id)}&unit=${nextUnit.no}#learn`
        : null,
      homeHash
    };
  } else {
    window.GAME_CONFIG = { bookId: book.id, unitId: null, nextUrl: null, homeHash };
  }
})();
</script>
<script src="game.js"></script>
</body>
</html>
